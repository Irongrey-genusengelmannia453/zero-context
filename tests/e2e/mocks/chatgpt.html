<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock ChatGPT</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #212121; color: #ECECEC; }
        #prompt-textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            background: #2F2F2F;
            border: 1px solid #555;
            color: #ECECEC;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>ChatGPT Mock UI</h1>
    <div 
        id="prompt-textarea" 
        contenteditable="true" 
        role="textbox" 
        aria-multiline="true"
        data-id="root"
    ></div>
</body>
</html>
